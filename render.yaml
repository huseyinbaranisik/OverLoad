# Render.com Blueprint (ücretsiz katman): New → Blueprint → bu repo
services:
  - type: web
    name: overload-uyum
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
