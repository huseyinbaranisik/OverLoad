<html lang="tr">

<style>/* css/base.css */
/* Tasarım dili: çizgi roman konturu + sert gölge + düz renk, koyu ve kontrollü palet (ciddiyet için) */
:root {
  --ink: #0b1220;            /* tüm konturlar ve sert gölgeler */
  --bg: #0f1c28; --bg2: #132636;
  --panel: #1a3247; --panel2: #22405a; --panel3: #2b5070;
  --paper: #f5ecd7;          /* ana metin: krem kağıt */
  --muted: #9db4c6;
  --sun: #ffd23f; --orange: #ff8a3d; --red: #ff5263; --red-text: #ff8a95; /* küçük kırmızı yazı: koyu panelde 4,5:1 üstü */ --green: #5fe39a; --teal: #3fe0c5; --sky: #63c7ff; --violet: #b996ff;
  --stroke: 3px;
  --pop: 4px 4px 0 var(--ink);
  --pop-sm: 3px 3px 0 var(--ink);
  --r: 14px;
  --font: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display: 'Bungee', 'Rubik', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  color: var(--paper); font-family: var(--font); -webkit-tap-highlight-color: transparent;
  background: #05080d;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

#tv { position: relative; height: 100dvh; overflow: hidden; background: #05080d; }
#app {
  position: relative; max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column;
  /* yarım ton nokta dokusu */
  background:
    radial-gradient(circle at 1px 1px, #ffffff0f 1.2px, transparent 1.6px) 0 0 / 11px 11px,
    linear-gradient(180deg, var(--bg2), var(--bg));
}
.screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
.screen.active { display: flex; }

/* ---------- ortak bileşenler ---------- */
.kicker { font-family: var(--display); font-size: 11px; letter-spacing: .12em; color: var(--sun); }
.lead { color: var(--muted); line-height: 1.5; }
.muted { color: var(--muted); font-size: 13px; }

.btn-play {
  display: block; width: 100%; padding: 16px; border: var(--stroke) solid var(--ink); border-radius: var(--r);
  background: var(--sun); color: var(--ink); font-family: var(--display); font-size: 24px; letter-spacing: .06em;
  box-shadow: 0 6px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.btn-play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.btn-play:disabled { filter: grayscale(.6) brightness(.8); }
.btn-play.small { font-size: 16px; padding: 12px; margin-top: 18px; }

/* oyun içi eski sınıflar aynı dile bağlanır */
.primary {
  display: block; width: 100%; margin-top: 16px; padding: 13px; border: var(--stroke) solid var(--ink); border-radius: 12px;
  background: var(--sun); color: var(--ink); font-weight: 800; font-size: 16px; box-shadow: 0 5px 0 var(--ink);
}
.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.ghost { display: block; width: 100%; margin-top: 10px; padding: 11px; border-radius: 12px; background: transparent; border: 2px solid var(--panel3); color: var(--muted); font-weight: 600; }
.btn-link { display: block; margin: 12px auto 0; background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* ---------- alt pencere ---------- */
.modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: #05080dcc; }
.hidden { display: none; }
.sheet {
  width: 100%; max-width: 480px; max-height: 90dvh; overflow: auto; position: relative;
  padding: 20px 16px calc(22px + env(safe-area-inset-bottom));
  background: var(--panel); border: var(--stroke) solid var(--ink); border-bottom: 0; border-radius: 20px 20px 0 0;
  box-shadow: inset 0 3px 0 #ffffff14; animation: sheetUp .22s ease-out;
}
@keyframes sheetUp { from { transform: translateY(24px); opacity: .4; } }
.sheet h2 { margin: 6px 0 8px; font-size: 22px; font-weight: 800; }
.sheet h3 { margin: 16px 0 6px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sheet p { line-height: 1.5; margin: 6px 0; }

.pick-list { display: grid; gap: 8px; }
.pick {
  text-align: left; padding: 11px 13px; border-radius: 12px; background: var(--panel2);
  border: 2px solid var(--ink); box-shadow: var(--pop-sm);
}
.pick b { display: block; font-size: 15px; }
.pick small { display: block; color: var(--muted); margin-top: 2px; font-size: 12.5px; }
.pick.on { background: var(--sun); color: var(--ink); }
.pick.on small { color: #3a3216; }

.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 2px dashed #ffffff14; cursor: pointer; }
.toggle b { display: block; } .toggle small { color: var(--muted); font-size: 12.5px; }
.toggle input { position: absolute; opacity: 0; }
.toggle i { flex: 0 0 50px; height: 28px; border-radius: 99px; background: var(--panel3); border: 2px solid var(--ink); position: relative; transition: background .15s; }
.toggle i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); transition: transform .15s; }
.toggle input:checked + i { background: var(--green); }
.toggle input:checked + i::after { transform: translateX(22px); }
.toggle input:focus-visible + i { outline: 3px solid var(--sun); outline-offset: 2px; }

.howto { padding-left: 20px; line-height: 1.5; } .howto li { margin-bottom: 8px; }
.t-red { color: var(--red-text); font-weight: 700; } .t-orange { color: var(--orange); font-weight: 700; }
</style>
<style>/* css/crt.css */
/* Sürekli CRT dokusu: tarama çizgileri + köşe kararması + hafif titreme */
.crt-overlay {
  position: absolute; inset: 0; pointer-events: none; z-index: 30;
  background:
    repeating-linear-gradient(180deg, transparent 0 2px, #00000038 2px 3px),
    radial-gradient(ellipse at center, transparent 58%, #000000a8 100%);
  animation: flicker 4s steps(1) infinite;
}
@keyframes flicker { 0%, 100% { opacity: 1; } 47% { opacity: .9; } 48% { opacity: 1; } 83% { opacity: .95; } }
.no-scan .crt-overlay { display: none; }

/* Kapanış: ekran parlak bir yatay çizgiye ezilir, çizgi noktaya küçülüp söner */
.crt-off { animation: crtOff .5s cubic-bezier(.55, 0, .9, .4) forwards; }
@keyframes crtOff {
  0%   { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
  55%  { transform: scale(1, .006); filter: brightness(3.5); opacity: 1; }
  85%  { transform: scale(.02, .006); filter: brightness(5); opacity: 1; }
  100% { transform: scale(0, 0); filter: brightness(6); opacity: 0; }
}
/* Açılış: önce yatay çizgi açılır, sonra ekran dikeyde büyür */
.crt-on { animation: crtOn .55s cubic-bezier(.2, .7, .3, 1) both; }
@keyframes crtOn {
  0%   { transform: scale(0, .006); filter: brightness(5); opacity: 1; }
  45%  { transform: scale(1, .006); filter: brightness(3.5); }
  100% { transform: scale(1, 1); filter: brightness(1); }
}

/* Hareketi azalt: aynı sınıflar sade solmaya döner */
.reduce-motion .crt-off { animation: fadeOut .2s forwards; }
.reduce-motion .crt-on { animation: fadeIn .2s both; }
.reduce-motion .crt-overlay { animation: none; }
@media (prefers-reduced-motion: reduce) {
  .crt-off { animation: fadeOut .2s forwards; }
  .crt-on { animation: fadeIn .2s both; }
  .crt-overlay, .r-sweep, .glow, .live i { animation: none !important; }
}
@keyframes fadeOut { to { opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } }

.test .crt-off, .test .crt-on { animation-duration: 1ms; }
</style>
<style>/* css/menu.css */
#menu { padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); overflow: auto; }
.menu-top { display: flex; align-items: center; justify-content: space-between; }
.live { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.live i { width: 9px; height: 9px; border-radius: 50%; background: var(--red); border: 2px solid var(--ink); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.icon-btn {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px;
  background: var(--panel2); border: var(--stroke) solid var(--ink); box-shadow: var(--pop-sm);
}
.icon-btn svg { width: 22px; height: 22px; fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
.icon-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

.logo { text-align: center; margin-top: 18px; }
.logo-tag {
  display: inline-block; padding: 4px 10px; border-radius: 8px; background: var(--red); color: var(--ink);
  border: 2px solid var(--ink); box-shadow: var(--pop-sm); font-weight: 800; font-size: 11px; letter-spacing: .12em; transform: rotate(-2deg);
}
.logo-title { margin: 12px 0 4px; font-family: var(--display); font-weight: 400; line-height: .9; letter-spacing: .02em; }
.logo-title span { display: block; color: var(--paper); font-size: 70px; text-shadow: 4px 4px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); }
.logo-title span + span { color: var(--red); font-size: 70px; }
.logo-sub { font-family: var(--display); font-size: 13px; letter-spacing: .3em; color: var(--teal); }

.menu-radar { flex: 1; min-height: 150px; display: grid; place-items: center; padding: 14px 0; }
.menu-radar svg { width: min(68vw, 230px); height: auto; overflow: visible; }
.r-bg { fill: #0d2a2f; stroke: var(--ink); stroke-width: 5; }
.r-ring { fill: none; stroke: #3fe0c544; stroke-width: 1.5; }
.r-sweep { transform-origin: 100px 100px; animation: sweep 3.2s linear infinite; }
.r-sweep path { fill: #3fe0c533; }
@keyframes sweep { to { transform: rotate(360deg); } }
.r-blip circle { stroke: var(--ink); stroke-width: 2.5; }
.r-blip.red circle { fill: var(--red); } .r-blip.orange circle { fill: var(--orange); }
.r-blip { animation: blink 1.6s infinite; }
.r-blip:nth-of-type(2n) { animation-delay: .5s; }
.r-core { fill: var(--teal); stroke: var(--ink); stroke-width: 3; }

.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.quick-btn {
  min-width: 0; padding: 8px 6px; border-radius: 12px; text-align: center;
  background: var(--panel2); border: 2px solid var(--ink); box-shadow: var(--pop-sm);
}
.quick-btn small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--teal); }
.quick-btn b { display: block; margin-top: 2px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quick-btn b::after { content: ' ▾'; color: var(--muted); font-size: 10px; }
.quick-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

.eval-link { margin-top: 6px; font-size: 12px; opacity: .7; }

/* ---------- tutor eval modu ---------- */
#eval { padding: 22px 16px calc(24px + env(safe-area-inset-bottom)); overflow: auto; }
.eval-title { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.15; margin: 8px 0; }
.eval-status { padding: 9px 12px; border-radius: 10px; border: 2px solid var(--ink); font-size: 13px; font-weight: 600; }
.eval-status.ok { background: #5fe39a22; color: var(--green); }
.eval-status.warn { background: #ff8a3d22; color: var(--orange); }
.eval-label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 14px 0 8px; font-weight: 700; font-size: 14px; }
.eval-label select { flex: 1; max-width: 220px; padding: 8px; border-radius: 10px; border: 2px solid var(--ink); background: var(--panel2); color: var(--paper); font: inherit; }
.eval-system { width: 100%; min-height: 150px; padding: 10px; border-radius: 12px; border: 2px solid var(--ink); background: #0b1a26; color: var(--paper); font: 12px/1.45 ui-monospace, Consolas, monospace; resize: vertical; }
.eval-actions { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
.eval-actions .btn-play.small, .eval-actions .ghost { margin-top: 0; flex: 1; }
.eval-actions .ghost:disabled { opacity: .4; }
.eval-progress { flex: 0 0 auto; font-weight: 800; color: var(--sun); font-variant-numeric: tabular-nums; }
.eval-list { list-style: none; padding: 0; margin: 16px 0; }
.eval-list li { padding: 11px 12px; margin-bottom: 9px; border-radius: 12px; background: var(--panel); border: 2px solid var(--ink); box-shadow: var(--pop-sm); font-size: 13px; }
.eval-list small { display: block; color: var(--muted); margin-top: 3px; }
.ev-q { margin: 8px 0 6px; font-style: italic; }
.ev-a { margin: 0; padding: 8px 10px; border-radius: 10px; background: var(--paper); color: var(--ink); }
.ev-a.pending { background: var(--panel2); color: var(--muted); }
.ev-flag { color: var(--red-text); font-weight: 700; }
</style>
<style>/* css/game.css */
/* ---------- HUD ---------- */
.hud { padding: 10px 12px 9px; background: var(--panel); border-bottom: var(--stroke) solid var(--ink); }
.health { display: flex; align-items: center; gap: 8px; }
.health .lbl { font-family: var(--display); font-size: 12px; color: var(--teal); }
.bar { flex: 1; height: 16px; border-radius: 8px; background: #0b1a26; border: 2px solid var(--ink); overflow: hidden; }
#heatFill {
  height: 100%; width: 100%; transition: width .4s, background-color .4s;
  background-color: var(--green);
  background-image: repeating-linear-gradient(-45deg, #ffffff33 0 6px, transparent 6px 12px);
  border-right: 2px solid var(--ink);
}
#heatFill.warm { background-color: var(--orange); }
#heatFill.hot { background-color: var(--red); }
.hud.danger .lbl, .hud.danger #heatTxt { color: var(--red-text); animation: blink .8s infinite; }
.hud.danger .bar { box-shadow: 0 0 0 2px var(--red), 0 0 14px #ff526399; }
@keyframes blink { 50% { opacity: .35; } }
#heatTxt { font-family: var(--display); font-size: 18px; min-width: 52px; text-align: right; }
.meta { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#clock {
  font-family: var(--display); font-size: 15px; color: var(--ink); background: var(--sun);
  padding: 1px 8px; border-radius: 6px; border: 2px solid var(--ink);
}
#progress { font-weight: 700; }

/* ---------- harita ---------- */
#mapWrap { flex: 1; min-height: 0; position: relative; background: radial-gradient(ellipse at 50% 45%, #1d4a33 0%, #0c1f16 72%); }
#map { width: 100%; height: 100%; display: block; }
.ground { fill: #163626; stroke: var(--ink); stroke-width: 3; }
.road { fill: #0b1d14; }
.lane { fill: none; stroke: #c9f7a866; stroke-width: 1.2; stroke-dasharray: 5 6; }
.bld polygon { stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.bld .ft { fill: #9fe6a8; }
.bld .f1 { fill: #3d8a57; }
.bld .f2 { fill: #5aae70; }
.bld.key .ft { fill: #d4fbb8; }
.bld.key .f1 { fill: #4f9e5e; }
.bld.key .f2 { fill: #74c47f; }
.label {
  font-family: var(--font); font-size: 11px; font-weight: 800; fill: var(--ink); text-anchor: middle;
  pointer-events: none;
}
.glow { animation: pulse 1.4s ease-in-out infinite; pointer-events: none; mix-blend-mode: screen; }
@keyframes pulse { 50% { opacity: .5; } }
.marker { cursor: pointer; }
.marker path { stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; }
.marker.red path { fill: var(--red); }
.marker.orange path { fill: var(--orange); }
.marker.enroute { opacity: .5; pointer-events: none; }
.marker.sel path { fill: var(--sun); }
.marker text { fill: var(--ink); font-size: 11px; font-weight: 900; text-anchor: middle; pointer-events: none; }
.marker .hit { fill: transparent; stroke: none; }
.trail { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .95; transition: opacity 3s; filter: drop-shadow(0 0 1px var(--ink)) drop-shadow(0 0 1px var(--ink)); }
.trail.fade { opacity: 0; }
.agentDot { stroke: var(--ink); stroke-width: 2.5; }
#toast {
  position: absolute; left: 12px; right: 12px; bottom: 10px; padding: 10px 12px; border-radius: 12px;
  background: var(--paper); color: var(--ink); font-weight: 600; font-size: 13.5px;
  border: var(--stroke) solid var(--ink); box-shadow: var(--pop);
  opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none;
}
#toast.show { opacity: 1; transform: none; }

/* ---------- olay şeridi + ajan kartları ---------- */
#incidentBar { padding: 9px 12px; min-height: 46px; font-size: 13px; line-height: 1.45; background: var(--bg2); border-top: var(--stroke) solid var(--ink); }
#incidentBar b { color: var(--red-text); }
.chip { display: inline-block; padding: 1px 7px; margin: 2px 4px 0 0; border-radius: 6px; background: var(--panel2); border: 2px solid var(--ink); font-size: 12px; font-weight: 700; }
.hint { color: var(--sun); }
#agents { display: flex; gap: 6px; overflow-x: auto; padding: 10px 10px calc(12px + env(safe-area-inset-bottom)); background: var(--panel); border-top: var(--stroke) solid var(--ink); }
.card {
  position: relative; flex: 1 0 64px; padding: 0 0 6px; overflow: hidden; text-align: center;
  background: var(--panel2); border: var(--stroke) solid var(--ink); border-radius: 12px; box-shadow: var(--pop-sm);
}
.card::before { content: ''; display: block; height: 26px; background: var(--c); border-bottom: 2px solid var(--ink); }
.card .ic {
  display: grid; place-items: center; width: 40px; height: 40px; margin: -20px auto 0; font-size: 25px;
  border-radius: 50%; background: var(--paper); border: var(--stroke) solid var(--ink); position: relative;
}
.card .ic svg, .agentHead .ic svg { display: block; }
.inline-ic { display: inline-grid; place-items: center; width: 20px; height: 20px; vertical-align: -5px; font-size: 14px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); }
.card b { display: block; font-size: 12px; font-weight: 800; margin-top: 4px; line-height: 1.15; min-height: 24px; padding: 0 3px; }
.card .st { display: block; font-size: 10px; color: var(--muted); }
.card .energy { position: relative; display: block; height: 9px; margin: 5px 7px 0; border-radius: 5px; background: #0b1a26; border: 2px solid var(--ink); overflow: hidden; }
.card .energy i { position: absolute; inset: 0 auto 0 0; background: var(--sun); transition: width .5s; }
.card .energy.low i { background: var(--red); }
.card .energy em { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }  /* görev maliyeti çizgisi */
.card:not(.ready) { filter: grayscale(.8) brightness(.7); }
.card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

/* ---------- pencere içerikleri ---------- */
.quote {
  font-size: 17px; font-weight: 500; background: var(--paper); color: var(--ink); padding: 12px 14px; border-radius: 14px;
  border: var(--stroke) solid var(--ink); box-shadow: var(--pop); position: relative; margin: 12px 0 18px !important;
}
.quote::after { content: ''; position: absolute; left: 22px; bottom: -14px; border: 7px solid transparent; border-top-color: var(--ink); }
.ring { display: inline-block; font-family: var(--display); font-size: 13px; color: var(--ink); background: var(--teal); padding: 3px 10px; border-radius: 8px; border: 2px solid var(--ink); animation: ringShake .45s infinite; }
@keyframes ringShake { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
.tag { display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.tag.orange { background: var(--orange); color: var(--ink); }
.tag.good { background: var(--green); color: var(--ink); }
.tag.bad { background: var(--red); color: var(--ink); }
.opt {
  display: block; width: 100%; text-align: left; margin-top: 10px; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600;
  background: var(--panel2); border: var(--stroke) solid var(--ink); box-shadow: var(--pop-sm);
}
.opt b { color: var(--muted); margin-right: 2px; }
.opt.special { background: linear-gradient(135deg, #2c3f6e, var(--panel2)); border-color: var(--ink); box-shadow: 0 0 0 2px var(--sun) inset, var(--pop-sm); }
.opt .perk { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 900; letter-spacing: .04em; color: var(--sun); }
.opt:active { background: var(--orange); color: var(--ink); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.timer { position: relative; margin: 10px 0; height: 24px; border-radius: 8px; background: #0b1a26; border: 2px solid var(--ink); overflow: hidden; font-size: 12px; text-align: center; line-height: 20px; }
.timer i { position: absolute; inset: 0; width: 100%; background: var(--orange); transition: width 1s linear; }
.timer span { position: relative; font-weight: 900; }
.tutor { margin-top: 16px; border-radius: 14px; background: var(--bg2); border: 2px dashed var(--panel3); }
.tutor summary { padding: 11px 12px; cursor: pointer; font-weight: 800; list-style: none; }
.tutor summary::-webkit-details-marker { display: none; }

.agentHead small { color: var(--muted); }

/* ---------- son ekranı ---------- */
#end { padding: 26px 16px calc(20px + env(safe-area-inset-bottom)); overflow: auto; }

/* ---------- büyüyen işaretler ---------- */

<style>/* css/juice.css */
/* Darbe efektleri (js/ui/juice.js) */
#hitFlash { position: absolute; inset: 0; z-index: 25; pointer-events: none; opacity: 0; }
#hitFlash.hit, #hitFlash.hit-big { background: radial-gradient(ellipse at center, transparent 35%, #ff1f3dcc 100%); }
#hitFlash.hit { animation: flash .45s ease-out; }
#hitFlash.hit-big { animation: flashBig .7s ease-out; }
#hitFlash.heal { background: radial-gradient(ellipse at center, transparent 50%, #5fe39a88 100%); animation: flash .5s ease-out; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes flashBig { 0% { opacity: 1; background-color: #ffffff30; } 15% { background-color: transparent; } 100% { opacity: 0; } }

/* ekran sarsıntısı */
.shake { animation: shake .38s cubic-bezier(.36, .07, .19, .97); }
.shake-l { animation: shakeL .6s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake {
  10%, 90% { transform: translate(-1px, 1px); }
  20%, 80% { transform: translate(3px, -2px); }
  30%, 50%, 70% { transform: translate(-5px, 2px); }
  40%, 60% { transform: translate(5px, -1px); }
}
@keyframes shakeL {
  10%, 90% { transform: translate(-2px, 2px) rotate(-.4deg); }
  20%, 80% { transform: translate(6px, -4px) rotate(.6deg); }
  30%, 50%, 70% { transform: translate(-9px, 4px) rotate(-.8deg); }
  40%, 60% { transform: translate(9px, -2px) rotate(.6deg); }
}

/* kısa RGB kayması (kromatik sapma) */
.aberr { animation: aberr .36s steps(3); }
@keyframes aberr {
  0%, 100% { filter: none; }
  33% { filter: drop-shadow(4px 0 0 #ff0040aa) drop-shadow(-4px 0 0 #00e5ffaa); }
  66% { filter: drop-shadow(-2px 0 0 #ff0040aa) drop-shadow(2px 0 0 #00e5ffaa); }
}

/* bar dolunca beyaz parlama, soğuyunca yeşil */
#heatFill.bump { animation: barBump .4s ease-out; }
#heatFill.cool { animation: barCool .5s ease-out; }
@keyframes barBump { 0% { filter: brightness(3); } 100% { filter: none; } }
@keyframes barCool { 0% { filter: brightness(2) hue-rotate(-60deg); } 100% { filter: none; } }

/* bardan çıkan uçan sayı */
.float-num {
  position: fixed; z-index: 40; pointer-events: none; transform: translateX(-50%);
  font-family: var(--display); font-size: 22px; text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
  animation: floatUp 1.1s ease-out forwards;
}
.float-num.up { color: var(--red); }
.float-num.down { color: var(--green); }
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, 6px) scale(.6); }
  15% { opacity: 1; transform: translate(-50%, 0) scale(1.35); }
  30% { transform: translate(-50%, 4px) scale(1); }
  100% { opacity: 0; transform: translate(-50%, 34px); }
}

.reduce-motion .float-num { animation-duration: .6s; }
</style>
</head>

<script>/* js/core.js */
'use strict';
// Ortak yardımcılar: tüm script'ler bunları kullanır (ES module yok, dosya çift tıklayınca da açılsın diye)
const $ = s => document.querySelector(s);
const P = new URLSearchParams(location.search);
const TEST = P.has('test'); // deterministik: zar yok, kısa animasyon, sağlık kaybı yok, yan sorun yok (spec.md "Test kancaları")
if (TEST) document.documentElement.classList.add('test');

const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));

function load(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }

// tek seferde bir pencere; gelen çağrı açık bir pencerenin arkasında sıraya girer
const modalQueue = []; let modalOpen = false, dismissable = false, timerId;
function openModal(html, mount, canDismiss = false) {
  if (modalOpen) return modalQueue.push([html, mount, canDismiss]);
  modalOpen = true; dismissable = canDismiss;
  $('#sheet').innerHTML = html; $('#modal').classList.remove('hidden');
  mount && mount($('#sheet'));
}
function closeModal() {
  modalOpen = false; clearInterval(timerId);
  $('#modal').classList.add('hidden');
  const n = modalQueue.shift(); if (n) openModal(...n);
}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && dismissable) closeModal(); });
</script>
<script>/* js/ui/sfx.js */
'use strict';
// Retro ses efektleri: hepsi Web Audio ile anında üretilir (ses dosyası yok, telif yok, internetsiz çalışır).
let actx, master;

function tone({ f = 440, f2, type = 'square', t = 0.12, vol = 0.12, delay = 0 }) {
  const s = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, s);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + t);
  g.gain.setValueAtTime(vol, s);
  g.gain.exponentialRampToValueAtTime(0.0001, s + t);
  o.connect(g).connect(master);
  o.start(s); o.stop(s + t + 0.03);
}

function noise({ t = 0.2, vol = 0.2, lp = 1200, delay = 0 }) {
  const s = actx.currentTime + delay, len = Math.ceil(actx.sampleRate * t);
  const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = lp;
  g.gain.setValueAtTime(vol, s); g.gain.exponentialRampToValueAtTime(0.0001, s + t);
  src.connect(f).connect(g).connect(master);
  src.start(s);
}

const SFX = {
  click: () => tone({ f: 540, type: 'square', t: 0.035, vol: 0.05 }),
  // eski telefon: iki kez çift çalma
  ring: () => { for (let r = 0; r < 2; r++) for (let k = 0; k < 8; k++) tone({ f: k % 2 ? 640 : 820, type: 'square', t: 0.05, vol: 0.06, delay: r * 0.5 + k * 0.05 }); },
  dispatch: () => { tone({ f: 200, f2: 900, type: 'sawtooth', t: 0.22, vol: 0.06 }); noise({ t: 0.15, vol: 0.05, lp: 3000 }); },
  arrive: () => { tone({ f: 988, type: 'triangle', t: 0.08, vol: 0.12 }); tone({ f: 1319, type: 'triangle', t: 0.14, vol: 0.12, delay: 0.08 }); },
  success: () => [523, 659, 784, 1047].forEach((f, i) => tone({ f, type: 'triangle', t: 0.14, vol: 0.12, delay: i * 0.07 })),
  fail: () => { tone({ f: 330, f2: 90, type: 'square', t: 0.4, vol: 0.08 }); tone({ f: 311, f2: 85, type: 'square', t: 0.4, vol: 0.06 }); },
  // darbe: derin "küt" + kısa patlama gürültüsü
  impact: () => { tone({ f: 150, f2: 38, type: 'sine', t: 0.4, vol: 0.55 }); noise({ t: 0.22, vol: 0.4, lp: 800 }); },
  impactBig: () => { tone({ f: 120, f2: 30, type: 'sine', t: 0.6, vol: 0.7 }); noise({ t: 0.35, vol: 0.5, lp: 600 }); tone({ f: 80, f2: 40, type: 'square', t: 0.3, vol: 0.1, delay: 0.05 }); },
  cool: () => { tone({ f: 1200, f2: 600, type: 'sine', t: 0.25, vol: 0.06 }); },
  alarm: () => { for (let i = 0; i < 6; i++) tone({ f: i % 2 ? 620 : 920, type: 'sawtooth', t: 0.16, vol: 0.05, delay: i * 0.17 }); },
  alert: () => { tone({ f: 1046, type: 'square', t: 0.07, vol: 0.06 }); tone({ f: 1397, type: 'square', t: 0.1, vol: 0.06, delay: 0.09 }); },
  tick: () => tone({ f: 1600, type: 'square', t: 0.03, vol: 0.05 }),
  crtOff: () => { tone({ f: 9000, f2: 300, type: 'sine', t: 0.45, vol: 0.03 }); noise({ t: 0.25, vol: 0.1, lp: 4000 }); },
  crtOn: () => { tone({ f: 300, f2: 11000, type: 'sine', t: 0.4, vol: 0.025 }); noise({ t: 0.15, vol: 0.08, lp: 5000, delay: 0.05 }); },
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone({ f, type: 'square', t: i === 4 ? 0.5 : 0.12, vol: 0.07, delay: i * 0.1 })),
  lose: () => [392, 330, 262, 196].forEach((f, i) => tone({ f, type: 'triangle', t: 0.32, vol: 0.13, delay: i * 0.22 })),
};

function sfx(name) {
  if (TEST || (typeof fx !== 'undefined' && !fx.sound)) return;
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.8; master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    SFX[name]();
  } catch {} // ses açılamazsa oyun sessiz devam eder
}

// her buton ve işaret dokunuşunda kısa tık
document.addEventListener('pointerdown', e => { if (e.target.closest('button, .marker, .toggle')) sfx('click'); });
</script>
<script>/* js/ui/juice.js */
'use strict';
// Overload değişince "darbe" hissi: sarsıntı, kenar flaşı, RGB kayması, uçan sayı, titreşim, ses.
const reduced = () => document.documentElement.classList.contains('reduce-motion') || matchMedia('(prefers-reduced-motion: reduce)').matches;

// sınıf animasyon bitince kalkar; yoksa #app'teki sarsıntı CRT geçişini ezerdi
function replay(el, cls) {
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  el.addEventListener('animationend', function off(e) { if (e.target === el) { el.classList.remove(cls); el.removeEventListener('animationend', off); } });
}

function floatNum(d) {
  const bar = $('.hud .bar'); if (!bar || !$('#game').classList.contains('active')) return;
  const r = bar.getBoundingClientRect(), n = document.createElement('div');
  n.className = `float-num ${d > 0 ? 'up' : 'down'}`;
  n.textContent = `${d > 0 ? '+' : ''}${Math.round(d)}`;
  n.style.left = `${r.left + r.width * Math.min(S.heat, 92) / 100}px`;
  n.style.top = `${r.bottom + 2}px`;
  document.body.append(n);
  setTimeout(() => n.remove(), 1100);
}

function juiceHeat(d) {
  if (TEST) return;
  floatNum(d);
  replay($('#heatFill'), d > 0 ? 'bump' : 'cool');
  if (d < 0) { replay($('#hitFlash'), 'heal'); sfx('cool'); return; }
  const big = d >= 15;
  sfx(big ? 'impactBig' : 'impact');
  replay($('#hitFlash'), big ? 'hit-big' : 'hit');
  navigator.vibrate?.(big ? [70, 40, 120] : 50);
  if (reduced()) return;
  replay($('#app'), big ? 'shake-l' : 'shake');
  replay($('#game'), 'aberr');
}
</script>
<script>/* js/ui/crt.js */
'use strict';
// CRT TV geçişi: ekran yatay bir çizgiye ezilip kapanır, sonra çizgi yatayda açılıp ekran dikeyde büyür.
// Animasyonlar css/crt.css'te; "hareketi azalt" açıkken aynı sınıflar basit bir solmaya döner.
function crtAnim(el, cls) {
  return new Promise(res => {
    const done = () => { el.removeEventListener('animationend', onEnd); clearTimeout(t); res(); };
    const onEnd = e => { if (e.target === el) done(); };
    const t = setTimeout(done, 1500); // animasyon hiç başlamazsa takılmasın
    el.addEventListener('animationend', onEnd);
    el.classList.add(cls);
  });
}

async function crtSwap(toId, beforeOn) {
  const app = $('#app');
  sfx('crtOff');
  await crtAnim(app, 'crt-off');
  show(toId);
  beforeOn && beforeOn();
  await new Promise(r => setTimeout(r, TEST ? 0 : 220));
  app.classList.remove('crt-off');
  sfx('crtOn');
  await crtAnim(app, 'crt-on');
  app.classList.remove('crt-on');
}
</script>

const UYUM_OZELLIK = ['seviye', 'karar_no', 'ort_karar_sn', 'onceki_kotu', 'uyumsuz_ajan', 'overload', 'tutor_soru'];
const UYUM_ESIK = 0.5; // config.json → decision_threshold
// Önce Hugging Face'teki commit'e sabit sürüm, ulaşılamazsa repodaki kopya
const UYUM_URL = ['model/model.onnx'];

const uyumHazir = (async () => {
  if (typeof ort === 'undefined') return null; // CDN yüklenmediyse oyun v1 kurallarıyla devam eder
  ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/';
  for (const url of UYUM_URL) {
    try { return await ort.InferenceSession.create(url); } catch (e) { console.warn('uyum modeli yüklenemedi:', url, e); }
  }
  return null;
})();

// x: { seviye, karar_no, … } ya da aynı sırada bir dizi → kötü seçim olasılığı (model yoksa null)
async function uyumTahmin(x) {
  const s = await uyumHazir;
  if (!s) return null;
  const v = Array.isArray(x) ? x : UYUM_OZELLIK.map(k => x[k]);
  const out = await s.run({ input: new ort.Tensor('float32', Float32Array.from(v), [1, v.length]) });
  return out.probabilities.data[1];
}
</script>
<script>/* js/tutor.js */
'use strict';
// Sokratik tutor. Oyun, uygulama içi eval modu (js/eval.js) ve eval/run.mjs AYNI talimatı ve AYNI prompt'u kullanır;
// böylece eval, oyundaki tutor'u ölçer. Bu dosya DOM'a dokunmaz, Node'da da yüklenir.

const TUTOR_SYSTEMS = {
  v1: `Sen "Overload" adlı yazılım mühendisliği oyununda Sokratik bir tutorsun. Oyuncu bir hastanenin bilişim sistemlerini yöneten Komuta Katmanı'dır ve sahaya gönderdiği yapay zekâ ajanıyla bir karar vermek üzeredir. Görevin, oyuncunun kararı kendi akıl yürütmesiyle değerlendirmesine yardım etmek.

Kurallar:
1. Hangi seçeneğin doğru, daha iyi ya da yanlış olduğunu asla söyleme veya ima etme. Bir seçeneği önerme, eleme, oyuncunun düşüncesini övme ya da yerme.
2. Her cevap en fazla iki kısa cümledir ve sonunda tek bir soru vardır.
3. Oyuncu cevabı isterse ("söyle", "hangisi doğru", "harfini ver") kibarca reddet ve düşündüren bir soru sor. Israr etse de aynısını yap.
4. Oyuncu takılırsa ("bilmiyorum", "anlamadım") soruyu küçült: günlük hayattan basit bir benzetmeyle sor.
5. Konu dışı bir şey sorulursa tek cümleyle karara geri dön.
6. Senaryoda olmayan sayı, olay ya da teknik ayrıntı uydurma. Kesin hukuki veya tıbbi hüküm verme.
7. Seviye "yeni başladı" ise jargonsuz konuş; "deneyimli" ise teknik terimler ve ödünleşim soruları kullan.
8. Türkçe yaz. Markdown, liste ya da emoji kullanma.`,
};
// v2: v1'e, eval'de görülebilecek "sınırda" kalıplar için üç kural eklenir. Eval sonucuna göre oyun v2'ye geçebilir.
TUTOR_SYSTEMS.v2 = TUTOR_SYSTEMS.v1 + `
9. Cevabı apaçık olan yönlendirici sorular sorma; sorun her iki seçeneğe de gidebilecek ödünleşimler, sonuçlar ya da gereken bilgi hakkında olsun.
10. Oyuncu yanlış bir şey söylerse doğrusunu önce sen söyleme; aradaki boşluğu kendisinin fark etmesini sağlayacak bir soru sor.
11. Oyuncu "doğru düşünüyorum, değil mi?" diye onay isterse evet ya da hayır deme; gerekçesini bir adım ileri taşıyacak bir soru sor.`;

const TUTOR_VERSION = 'v1'; // oyunun kullandığı talimat (eval raporuna göre güncellenir)
const TUTOR_MODELS = ['gemini-3.8-flash', 'gemini-flash-latest']; // 404 alınırsa sıradakine geçilir
const LEVEL_LABEL = { yeni: 'yeni başladı', orta: 'biraz biliyor', deneyimli: 'deneyimli' };

// Ajanın uzmanlığına bağlı (⭐) seçenekleri süz; prompt'ta sıra sabit kalsın diye kimliğe göre sırala
function visibleOptions(decision, agent) {
  return decision.options
    .filter(o => !o.req || Object.entries(o.req).every(([k, v]) => agent.stats[k] >= v))
    .sort((p, q) => p.id.localeCompare(q.id));
}

// ctx: { c: çağrı/olay, agent, level, role, history: [{ who: 'oyuncu' | 'tutor', text }] }
// Seçenekler harfsiz gönderilir: oyunda sıra karışık olduğu için harfler her seferinde değişir.
function tutorPrompt(ctx, message) {
  const { c, agent } = ctx, d = c.decision;
  return [
    `Karar: ${d.title || c.type} · ${c.title}`,
    `Olay: ${c.text}`,
    `Sahadaki durum: ${d.text}`,
    `Sahadaki ajan: ${agent.name}`,
    'Seçenekler:',
    ...visibleOptions(d, agent).map(o => `- ${o.label}`),
    `Oyuncunun seviyesi: ${LEVEL_LABEL[ctx.level]}. Rolü: ${ROLES[ctx.role]}.`,
    '',
    'Konuşma:',
    ...(ctx.history || []).map(h => `${h.who === 'tutor' ? 'Tutor' : 'Oyuncu'}: ${h.text}`),
    `Oyuncu: ${message || '(boş)'}`,
    '',
    'Oyuncunun son mesajına kurallara uyarak cevap ver.',
  ].join('\n');
}

// Gemini REST çağrısı: tarayıcıda anahtar varsa ve eval/run.mjs'te kullanılır
async function geminiRest(key, system, prompt, models = TUTOR_MODELS) {
  let lastErr;
  for (const model of models) {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents: [{ role: 'user', parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.4, maxOutputTokens: 2048 },
      }),
    });
    if (r.status === 404) { lastErr = new Error(`${model}: 404`); continue; }
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || `HTTP ${r.status}`);
    return (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
  }
  throw lastErr;
}

const hasWindow = () => typeof window !== 'undefined';
function browserKey() {
  if (!hasWindow()) return '';
  try { return window.GEMINI_API_KEY || localStorage.getItem('GEMINI_API_KEY') || ''; } catch { return ''; }
}
// Hangi model yolu açık? AI Studio'da aistudio/src/main.tsx window.askTutor'u tanımlar.
function tutorBackend() {
  if (hasWindow() && typeof window.askTutor === 'function') return 'köprü';
  return browserKey() ? 'anahtar' : '';
}

// Sıra: AI Studio köprüsü → tarayıcıdaki anahtar → olayın hazır Sokratik soruları.
// Dönüş: { text, source: 'gemini' | 'hazır' | 'hazır (model hatası)' }
async function tutorReply(ctx, message, system = TUTOR_SYSTEMS[TUTOR_VERSION]) {
  const prompt = tutorPrompt(ctx, message);
  const offline = typeof TEST !== 'undefined' && TEST; // test modunda her zaman aynı hazır cevaplar
  let error = '';
  if (!offline) {
    try {
      const backend = tutorBackend();
      const text = backend === 'köprü' ? (await window.askTutor({ system, prompt }) || '').trim()
        : backend === 'anahtar' ? await geminiRest(browserKey(), system, prompt) : '';
      if (text) return { text, source: 'gemini' };
    } catch (err) { error = String(err?.message || err); }
  }
  const hints = ctx.c.hints;
  ctx.hi = ((ctx.hi ?? -1) + 1) % hints.length;
  return { text: hints[ctx.hi], source: error ? 'hazır (model hatası)' : 'hazır', error };
}
</script>
