<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Overload — Komuta Katmanı</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/base.css?v=7">
<link rel="stylesheet" href="css/crt.css?v=7">
<link rel="stylesheet" href="css/menu.css?v=7">
<link rel="stylesheet" href="css/game.css?v=8">
<link rel="stylesheet" href="css/juice.css?v=7">
</head>
<body>
<div id="tv">
  <div id="app">
    <section id="menu" class="screen active">
      <header class="menu-top">
        <span class="live"><i></i> CANLI · ŞEHİR HASTANESİ</span>
        <button class="icon-btn" data-cy="settings" aria-label="Ayarlar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.4 4.6-1.9 1.1.2 2.2-2 1.2-1.8-1.3-2 .9-.6 2.1h-2.4l-.6-2.1-2-.9-1.8 1.3-2-1.2.2-2.2-1.9-1.1v-2.2l1.9-1.1-.2-2.2 2-1.2 1.8 1.3 2-.9.6-2.1h2.4l.6 2.1 2 .9 1.8-1.3 2 1.2-.2 2.2 1.9 1.1Z"/></svg>
        </button>
      </header>

      <div class="logo">
        <div class="logo-tag">YZM301 · SE PRIMER</div>
        <h1 class="logo-title"><span>OVER</span><span>LOAD</span></h1>
        <div class="logo-sub">KOMUTA KATMANI</div>
      </div>

      <div class="menu-radar" aria-hidden="true">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="92" class="r-bg"/>
          <circle cx="100" cy="100" r="64" class="r-ring"/>
          <circle cx="100" cy="100" r="34" class="r-ring"/>
          <path d="M100 8v184M8 100h184" class="r-ring"/>
          <g class="r-sweep"><path d="M100 100 L100 8 A92 92 0 0 1 179 53 Z"/></g>
          <g class="r-blip red" transform="translate(140 62)"><circle r="7"/></g>
          <g class="r-blip orange" transform="translate(62 128)"><circle r="6"/></g>
          <g class="r-blip red" transform="translate(120 150)"><circle r="5"/></g>
          <circle cx="100" cy="100" r="9" class="r-core"/>
        </svg>
      </div>

      <div class="menu-bottom">
        <div class="quick">
          <button class="quick-btn" data-pick="role" data-cy="pick-role"><small>ROL</small><b></b></button>
          <button class="quick-btn" data-pick="difficulty" data-cy="pick-difficulty"><small>ZORLUK</small><b></b></button>
          <button class="quick-btn" data-pick="preset" data-cy="pick-preset"><small>ÖN AYAR</small><b></b></button>
        </div>
        <button class="btn-play" data-cy="play">OYNA</button>
        <button class="btn-link" data-cy="how">Nasıl oynanır?</button>
        <button class="btn-link eval-link" data-cy="eval-open">Tutor eval modu</button>
      </div>
    </section>

    <section id="game" class="screen">
      <header class="hud">
        <div class="health">
          <span class="lbl">OVERLOAD</span>
          <div class="bar"><div id="heatFill"></div></div>
          <b id="heatTxt" data-cy="heat">%0</b>
        </div>
        <div class="meta"><span id="clock" data-cy="clock">08:00</span><span id="progress" data-cy="progress">0/3 çağrı</span></div>
      </header>
      <div id="mapWrap">
        <svg id="map" viewBox="0 0 400 500" aria-label="Şehir haritası"></svg>
        <div id="toast" data-cy="toast"></div>
      </div>
      <div id="incidentBar" data-cy="incident-bar"></div>
      <div id="agents"></div>
    </section>

    <section id="end" class="screen"></section>
    <section id="eval" class="screen"></section>
  </div>
  <div id="hitFlash" aria-hidden="true"></div>
  <div class="crt-overlay" aria-hidden="true"></div>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="js/core.js?v=7"></script>
<script src="js/ui/sfx.js?v=7"></script>
<script src="js/ui/juice.js?v=7"></script>
<script src="js/ui/crt.js?v=7"></script>
<script src="js/data/agents.js?v=7"></script>
<script src="js/data/story.js?v=7"></script>
<script src="js/data/incidents.js?v=7"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
<script src="js/uyum.js?v=9"></script>
<script src="js/tutor.js?v=7"></script>
<script src="js/data/eval-cases.js?v=7"></script>
<script src="js/minigames.js?v=7"></script>
<script src="js/game.js?v=8"></script>
<script src="js/eval.js?v=7"></script>
<script src="js/menu.js?v=7"></script>
</body>
</html>
